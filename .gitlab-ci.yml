# GitLab CI/CD Pipeline for Datadog Cost Analyzer
# This pipeline runs tests, builds, and validates the application on every commit

stages:
  - run

variables:
  # Python version and pip cache configuration
  PYTHON_VERSION: "3.9"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR/src"
  
  # Application configuration
  FLASK_ENV: "testing"
  LOG_LEVEL: "INFO"

# Cache configuration for faster builds
cache:
  paths:
    - .cache/pip/
    - .pytest_cache/

# Template for Python jobs
.python_template: &python_template
  image: python:${PYTHON_VERSION}
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - export PYTHONPATH=$CI_PROJECT_DIR/src

run_cost_analyzer:
  <<: *python_template
  stage: run
  variables:
    DD_API_KEY: $DD_API_KEY
    DD_APP_KEY: $DD_APP_KEY
    DD_SITE: ${DD_SITE:-datadoghq.com}
  script:
    - echo "Running cost analyzer to create/update Datadog notebook..."
    - python -m datadog_cost_analyzer.cli test-connection || echo "[WARNING] API connection test failed"
    - |
      if [ -n "$DD_API_KEY" ] && [ -n "$DD_APP_KEY" ]; then
        echo "Creating daily-delta notebook..."
        python -m datadog_cost_analyzer.cli create_notebook --weeks 12 --include-daily-delta -t "Automated Daily Delta Notebook"
      else
        echo "DD_API_KEY/DD_APP_KEY not provided. Skipping notebook creation."
        exit 0
      fi
  only:
    - branches
    - merge_requests